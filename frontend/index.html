<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predict whether a telecom customer will churn using a machine learning model.">
    <title>Telco Customer Churn Prediction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📉 Telco Customer Churn Prediction</h1>
        <p class="subtitle">Enter customer details to predict churn likelihood</p>

        <form id="predict-form">
            <!-- Demographics -->
            <fieldset>
                <legend>Demographics</legend>

                <div class="form-group">
                    <label for="SeniorCitizen">Senior Citizen</label>
                    <select id="SeniorCitizen" name="SeniorCitizen" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Partner">Partner</label>
                    <select id="Partner" name="Partner" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="Dependents">Dependents</label>
                    <select id="Dependents" name="Dependents" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                    </select>
                </div>
            </fieldset>

            <!-- Account -->
            <fieldset>
                <legend>Account</legend>

                <div class="form-group">
                    <label for="tenure">Tenure (months)</label>
                    <input type="number" id="tenure" name="tenure" min="0" max="72" value="1" required>
                </div>

                <div class="form-group">
                    <label for="Contract">Contract</label>
                    <select id="Contract" name="Contract" required>
                        <option value="Month-to-month" selected>Month-to-month</option>
                        <option value="One year">One year</option>
                        <option value="Two year">Two year</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="PaperlessBilling">Paperless Billing</label>
                    <select id="PaperlessBilling" name="PaperlessBilling" required>
                        <option value="Yes" selected>Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="PaymentMethod">Payment Method</label>
                    <select id="PaymentMethod" name="PaymentMethod" required>
                        <option value="Electronic check" selected>Electronic check</option>
                        <option value="Mailed check">Mailed check</option>
                        <option value="Bank transfer (automatic)">Bank transfer (automatic)</option>
                        <option value="Credit card (automatic)">Credit card (automatic)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="MonthlyCharges">Monthly Charges ($)</label>
                    <input type="number" id="MonthlyCharges" name="MonthlyCharges" min="0" step="0.01" value="29.85" required>
                </div>

                <div class="form-group">
                    <label for="TotalCharges">Total Charges ($)</label>
                    <input type="number" id="TotalCharges" name="TotalCharges" min="0" step="0.01" value="29.85" required>
                </div>
            </fieldset>

            <!-- Services -->
            <fieldset>
                <legend>Services</legend>

                <div class="form-group">
                    <label for="PhoneService-display">Phone Service</label>
                    <select id="PhoneService-display" name="PhoneService-display" onchange="updateMultipleLines()">
                        <option value="Yes" selected>Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="MultipleLines">Multiple Lines</label>
                    <select id="MultipleLines" name="MultipleLines" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No phone service">No phone service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="InternetService">Internet Service</label>
                    <select id="InternetService" name="InternetService" required onchange="updateInternetDependents()">
                        <option value="DSL" selected>DSL</option>
                        <option value="Fiber optic">Fiber optic</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="OnlineSecurity">Online Security</label>
                    <select id="OnlineSecurity" name="OnlineSecurity" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="OnlineBackup">Online Backup</label>
                    <select id="OnlineBackup" name="OnlineBackup" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="DeviceProtection">Device Protection</label>
                    <select id="DeviceProtection" name="DeviceProtection" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="TechSupport">Tech Support</label>
                    <select id="TechSupport" name="TechSupport" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="StreamingTV">Streaming TV</label>
                    <select id="StreamingTV" name="StreamingTV" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="StreamingMovies">Streaming Movies</label>
                    <select id="StreamingMovies" name="StreamingMovies" required>
                        <option value="Yes">Yes</option>
                        <option value="No" selected>No</option>
                        <option value="No internet service">No internet service</option>
                    </select>
                </div>
            </fieldset>

            <button type="submit" id="predict-btn">
                <span id="btn-text">Predict</span>
                <span id="btn-loading" class="hidden">Predicting...</span>
            </button>
        </form>

        <!-- Result -->
        <div id="result" class="result hidden">
            <h2>Prediction Result</h2>
            <div id="prediction-value" class="prediction-value"></div>
            <div id="probability-value" class="probability-value"></div>
        </div>

        <!-- Error -->
        <div id="error" class="error hidden">
            <p id="error-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
